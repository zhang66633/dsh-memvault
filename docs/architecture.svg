<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">MemVault 与 DSH 插件：一个引擎，三个适配器</title>
  <desc id="archDesc">MemVault 由引擎与一个 SQLite 库组成；CLI、MCP stdio、HTTP 控制台是它的三个适配器。DSH 插件通过 CLI 子进程写库、用 node:sqlite 直读库，并借 MCP 连接器把工具交给模型。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/>
    </marker>
  </defs>

  <style>
    .t   { font-family: -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .m   { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1f2328; }
    .mu  { font-family: -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; fill: #656d76; }
    .h   { font-weight: 600; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
    .engine { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; rx: 12; }
    .store  { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; rx: 12; }
    .plugin { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; rx: 12; }
    .flow { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #8250df; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowDash); }
    .note { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; rx: 8; }
  </style>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text class="t h" x="32" y="42" font-size="21">MemVault 与 DSH 插件：一个引擎，三个适配器</text>
  <text class="mu" x="32" y="66" font-size="13">One engine, one store, three adapters — and one host integration</text>

  <!-- adapters (left) -->
  <text class="mu" x="32" y="108" font-size="12">适配器 / adapters（薄层，共用同一引擎）</text>
  <rect class="box" x="32" y="120" width="252" height="72"/>
  <text class="m h" x="48" y="148" font-size="14">cli.py</text>
  <text class="mu" x="48" y="170" font-size="12">脚本化、一次性操作</text>

  <rect class="box" x="32" y="212" width="252" height="72"/>
  <text class="m h" x="48" y="240" font-size="14">mcp_server.py</text>
  <text class="mu" x="48" y="262" font-size="12">stdio · 16 个工具</text>

  <rect class="box" x="32" y="304" width="252" height="72"/>
  <text class="m h" x="48" y="332" font-size="14">api.py + dashboard</text>
  <text class="mu" x="48" y="354" font-size="12">HTTP 接口与控制台</text>

  <!-- engine (middle) -->
  <rect class="engine" x="352" y="120" width="292" height="256"/>
  <text class="t h" x="370" y="150" font-size="16">MemVault 引擎</text>
  <text class="m" x="370" y="180" font-size="12.5">memory.py · storage.py</text>
  <text class="m" x="370" y="202" font-size="12.5">vector_index.py · extractors.py</text>
  <text class="m" x="370" y="224" font-size="12.5">scopes.py · blocks</text>
  <text class="mu" x="370" y="256" font-size="12">写入即判定 ADD / UPDATE / DELETE</text>
  <text class="mu" x="370" y="276" font-size="12">矛盾记为 relations（带权重）</text>
  <text class="mu" x="370" y="296" font-size="12">每次判定进 history，可审计</text>
  <text class="mu" x="370" y="330" font-size="12">作用域是维度：user / agent / run</text>
  <text class="mu" x="370" y="350" font-size="12">三者正交，可同时成立</text>

  <!-- store -->
  <rect class="store" x="352" y="396" width="292" height="72"/>
  <text class="m h" x="370" y="424" font-size="14">data/memvault.db</text>
  <text class="mu" x="370" y="446" font-size="12">SQLite · 唯一真相（含 embedding）</text>

  <!-- engine → store -->
  <path class="flow" d="M 498 376 L 498 394"/>

  <!-- adapters → engine -->
  <path class="flow" d="M 284 156 L 350 172"/>
  <path class="flow" d="M 284 248 L 350 248"/>
  <path class="flow" d="M 284 340 L 350 324"/>

  <!-- consumers (right) -->
  <text class="mu" x="700" y="108" font-size="12">消费者 / consumers</text>

  <rect class="plugin" x="700" y="120" width="272" height="112"/>
  <text class="t h" x="716" y="148" font-size="15">DSH 插件 dsh-memvault</text>
  <text class="mu" x="716" y="170" font-size="12">注入核心块 · 按轮抽取 · 面板</text>
  <text class="mu" x="716" y="190" font-size="12">被商店收录的那个条目</text>
  <text class="mu" x="716" y="210" font-size="12">（声明了 dsh.bundle）</text>

  <rect class="box" x="700" y="250" width="272" height="86"/>
  <text class="t h" x="716" y="278" font-size="15">任何 MCP 宿主</text>
  <text class="mu" x="716" y="300" font-size="12">Claude Code / Codex / DSH …</text>
  <text class="mu" x="716" y="320" font-size="12">按需调用工具，不参与注入</text>

  <rect class="box" x="700" y="362" width="272" height="86"/>
  <text class="t h" x="716" y="390" font-size="15">浏览器 / 控制台</text>
  <text class="mu" x="716" y="412" font-size="12">记忆列表 · 关系图 · 统计</text>
  <text class="mu" x="716" y="432" font-size="12">人工查看与编辑</text>

  <!-- the two flows that are actually distinctive: plugin writes by spawning the CLI,
       and plugin reads the store directly with node:sqlite -->
  <path class="dash" d="M 700 136 L 310 136 L 310 118"/>
  <text class="mu" x="694" y="128" font-size="11.5" text-anchor="end">spawn 子进程（写）</text>
  <path class="dash" d="M 700 224 L 700 486 L 660 486 L 660 432 L 648 432"/>
  <text class="mu" x="694" y="502" font-size="11.5" text-anchor="end">node:sqlite 直读（读）</text>

  <!-- note -->
  <rect class="note" x="32" y="520" width="940" height="72"/>
  <text class="t" x="48" y="548" font-size="13">为什么是两个仓库：插件声明 <tspan class="m">dsh.bundle</tspan>，所以它可以进插件商店；MemVault 是通用服务，刻意不带宿主概念，</text>
  <text class="t" x="48" y="570" font-size="13">因此任何 MCP 客户端都能用它。两者共用同一个库文件——插件把 <tspan class="m">MEMVAULT_DB_PATH</tspan> 显式传给子进程，而不是靠默认值恰好相等。</text>
</svg>
